<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>各地特色美食展示</title>
    <meta name="description" content="中国各地与华人地区特色美食展示与筛选。">
    <link rel="preload" href="styles.css" as="style">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="container">
        <h1>各地特色美食展示</h1>
        <p class="subtitle">本项目为纯静态站点，所有图片均为本地 SVG，可离线访问</p>
      </div>
    </header>

    <main class="container" id="main" role="main">
      <section class="controls" aria-label="筛选与搜索">
        <div class="filters">
          <label for="regionSelect">地区</label>
          <select id="regionSelect" aria-label="选择地区">
            <option value="all">全部</option>
          </select>
        </div>
        <div class="search">
          <label for="searchInput">搜索</label>
          <input id="searchInput" type="search" placeholder="输入美食或城市关键字" aria-label="搜索美食">
        </div>
      </section>

      <section id="gallery" class="gallery" aria-live="polite" aria-busy="false">
        <!-- 动态渲染卡片 -->
      </section>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <p>© <span id="year"></span> 各地特色美食展示 · 纯静态前端示例</p>
      </div>
    </footer>

    <script defer src="app.js"></script>
  </body>
  </html>
